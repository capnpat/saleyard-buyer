<!DOCTYPE html>
<html lang="en-AU">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
  <meta name="description" content="A live-bidding companion for Australian saleyard buyers.">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Saleyard">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="theme-color" content="#050507">
  <meta name="format-detection" content="telephone=no">
  <meta name="color-scheme" content="dark">

  <title>Saleyard Buyer</title>

  <link rel="manifest" href="manifest.webmanifest">
  <link rel="apple-touch-icon" href="apple-touch-icon.png">
  <link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
  <link rel="icon" type="image/png" sizes="512x512" href="icon-512.png">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;600;800;900&family=JetBrains+Mono:wght@500;700&display=swap">

  <style>
    /* Base */
    html, body { margin: 0; padding: 0; }
    body {
      background: #0F0F10;
      color: #EAEAEC;
      font-family: -apple-system, BlinkMacSystemFont, system-ui, sans-serif;
      -webkit-font-smoothing: antialiased;
      -webkit-text-size-adjust: 100%;
      overscroll-behavior-y: none;
    }
    #root { min-height: 100vh; }

    /* Component styles */
    .arc { font-family: 'Archivo', system-ui, sans-serif; letter-spacing: -0.01em; }
    .mono { font-family: 'JetBrains Mono', ui-monospace, monospace; font-variant-numeric: tabular-nums; }
    .field {
      width: 100%; padding: 14px 14px; border: 1.5px solid #3A3A3F;
      border-radius: 8px; background: #242427; color: #EAEAEC;
      font-size: 22px;
      font-family: 'JetBrains Mono', ui-monospace, monospace;
      font-variant-numeric: tabular-nums; outline: none;
      -webkit-appearance: none; appearance: none;
      caret-color: #FFD66B;
      box-sizing: border-box;
    }
    .field::placeholder { color: #9A9AA1; }
    .field:focus { box-shadow: 0 0 0 3px rgba(234,234,236,0.12); border-color: #EAEAEC; }
    .field.over { border-color: #F87171; background: rgba(248,113,113,0.08); }
    .lbl { font-family: 'Archivo', system-ui, sans-serif; font-weight: 600;
           font-size: 12px; letter-spacing: 0.08em; text-transform: uppercase;
           color: #B0B0B5; margin-bottom: 6px; display: block; }
    .btn { font-family: 'Archivo', system-ui, sans-serif; font-weight: 800;
           letter-spacing: 0.04em; border-radius: 8px; padding: 16px 18px;
           border: 1.5px solid #3A3A3F; cursor: pointer; transition: transform 0.05s ease;
           -webkit-tap-highlight-color: transparent; touch-action: manipulation; }
    .btn:active { transform: translateY(1px); }
    .btn-primary { background: #EAEAEC; color: #0D0D0F; border-color: #EAEAEC; }
    .btn-primary:disabled { background: #2E2E32; border-color: #2E2E32; color: #6B6B70; cursor: not-allowed; }
    .btn-ghost { background: transparent; color: #EAEAEC; border-color: #3A3A3F; }
    .btn-warn { background: #DC2626; color: #FFFFFF; border-color: #DC2626; }
    .card { background: #1A1A1C; border: 1.5px solid #3A3A3F; border-radius: 12px; }
    .pill { display: inline-flex; align-items: center; gap: 6px; padding: 4px 10px;
            border-radius: 999px; font-family: 'Archivo', sans-serif; font-weight: 700;
            font-size: 11px; letter-spacing: 0.08em; text-transform: uppercase; }
    .row-line { display: grid; grid-template-columns: auto 1fr auto; gap: 12px; align-items: center; }
    .modal-bg { position: fixed; inset: 0; background: rgba(0,0,0,0.7); z-index: 50;
                display: flex; align-items: center; justify-content: center; padding: 16px; }
    .modal { background: #1A1A1C; border: 1.5px solid #3A3A3F; border-radius: 12px;
             max-width: 560px; width: 100%; max-height: 90vh; overflow-y: auto; color: #EAEAEC; }
    input[type=number]::-webkit-inner-spin-button { -webkit-appearance: none; margin: 0; }
    input[type=number] { -moz-appearance: textfield; }
    .toast { position: fixed; bottom: 110px; left: 50%; transform: translateX(-50%);
             background: #EAEAEC; color: #0D0D0F; padding: 12px 20px; border-radius: 8px;
             font-family: 'Archivo', sans-serif; font-weight: 700; z-index: 60;
             box-shadow: 0 8px 24px rgba(0,0,0,0.5); }
    select.field { background-image: linear-gradient(45deg, transparent 50%, #EAEAEC 50%),
                                     linear-gradient(135deg, #EAEAEC 50%, transparent 50%);
                   background-position: calc(100% - 18px) calc(50% - 3px),
                                        calc(100% - 12px) calc(50% - 3px);
                   background-size: 6px 6px, 6px 6px; background-repeat: no-repeat;
                   padding-right: 32px; }
    select.field option { background: #242427; color: #EAEAEC; }

    @media (min-width: 1024px) {
      .grid-2 { grid-template-columns: minmax(0, 1.05fr) minmax(0, 1fr); }
    }

    .splash {
      position: fixed; inset: 0; background: #0F0F10;
      display: flex; align-items: center; justify-content: center;
      font-family: 'Archivo', system-ui, sans-serif;
      font-weight: 800; letter-spacing: 0.1em; text-transform: uppercase;
      color: #9A9AA1;
    }
  </style>
</head>
<body>
  <div id="root"><div class="splash">Loading…</div></div>

  <script>
    (function () {
      window.storage = {
        get: function (key) {
          return new Promise(function (resolve) {
            try {
              var v = localStorage.getItem(key);
              resolve(v === null ? null : { key: key, value: v });
            } catch (e) { resolve(null); }
          });
        },
        set: function (key, value) {
          return new Promise(function (resolve) {
            try {
              localStorage.setItem(key, value);
              resolve({ key: key, value: value });
            } catch (e) { resolve(null); }
          });
        },
        delete: function (key) {
          return new Promise(function (resolve) {
            try {
              localStorage.removeItem(key);
              resolve({ key: key, deleted: true });
            } catch (e) { resolve(null); }
          });
        }
      };
    })();
  </script>

  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', function () {
        navigator.serviceWorker.register('service-worker.js').catch(function () {});
      });
    }
  </script>

  <script src="lib/react.production.min.js"></script>
  <script src="lib/react-dom.production.min.js"></script>
  <script src="lib/xlsx.full.min.js"></script>

  <script src="app.js"></script>
</body>
</html>
